services:
  hapi-fhir:
    image: hapiproject/hapi:latest
    container_name: hapi-fhir

    ports:
      - "8080:8080"

    restart: unless-stopped

    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://hapi-postgres:5432/hapi"
      SPRING_DATASOURCE_USERNAME: "admin"
      SPRING_DATASOURCE_PASSWORD: "admin"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
      HIBERNATE_DIALECT: "ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect"

    depends_on:
      hapi-postgres:
        condition: service_healthy

  hapi-postgres:
    image: postgres:16-alpine
    container_name: hapi-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: "hapi"
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "admin"

    volumes:
      - hapi-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U admin -d hapi"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hapi-postgres-data: