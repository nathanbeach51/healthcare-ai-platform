services:

  hapi-fhir:
    image: hapiproject/hapi:latest
    container_name: hapi-fhir

    ports:
      - "8080:8080"

    restart: unless-stopped

    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://hapi-postgres:5432/${PGVECTOR_DATABASE:-hapi}"
      SPRING_DATASOURCE_USERNAME: "${PGVECTOR_USER:-admin}"
      SPRING_DATASOURCE_PASSWORD: "${PGVECTOR_PASSWORD:-admin}"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
      HIBERNATE_DIALECT: "ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect"

    depends_on:
      hapi-postgres:
        condition: service_healthy


  hapi-postgres:
    image: pgvector/pgvector:pg16
    container_name: hapi-postgres

    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: "${PGVECTOR_DATABASE:-hapi}"
      POSTGRES_USER: "${PGVECTOR_USER:-admin}"
      POSTGRES_PASSWORD: "${PGVECTOR_PASSWORD:-admin}"

    volumes:
      - hapi-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PGVECTOR_USER:-admin} -d ${PGVECTOR_DATABASE:-hapi}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  airflow-postgres:
    image: postgres:16-alpine
    container_name: airflow-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: "${AIRFLOW_DB_NAME:-airflow}"
      POSTGRES_USER: "${AIRFLOW_DB_USER:-airflow}"
      POSTGRES_PASSWORD: "${AIRFLOW_DB_PASSWORD:-airflow}"
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AIRFLOW_DB_USER:-airflow} -d ${AIRFLOW_DB_NAME:-airflow}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: airflow-init

    depends_on:
      airflow-postgres:
        condition: service_healthy

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-postgres/${AIRFLOW_DB_NAME:-airflow}"
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:-healthcare-ai-local-jwt-secret}"
      FHIR_BASE_URL: "http://hapi-fhir:8080/fhir"
      PYTHONPATH: "/opt/airflow/project/src"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      PGVECTOR_HOST: "hapi-postgres"
      PGVECTOR_PORT: "5432"
      PGVECTOR_DATABASE: "${PGVECTOR_DATABASE:-hapi}"
      PGVECTOR_USER: "${PGVECTOR_USER:-admin}"
      PGVECTOR_PASSWORD: "${PGVECTOR_PASSWORD:-admin}"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: "${AIRFLOW_ADMIN_USER:-airflow}"
      _AIRFLOW_WWW_USER_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD:-airflow}"

    command: version


  airflow-api-server:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: airflow-api-server

    restart: unless-stopped

    depends_on:
      airflow-postgres:
        condition: service_healthy

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-postgres/${AIRFLOW_DB_NAME:-airflow}"
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USER:-airflow}:admin"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:-healthcare-ai-local-jwt-secret}"
      FHIR_BASE_URL: "http://hapi-fhir:8080/fhir"
      PYTHONPATH: "/opt/airflow/project/src"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      PGVECTOR_HOST: "hapi-postgres"
      PGVECTOR_PORT: "5432"
      PGVECTOR_DATABASE: "${PGVECTOR_DATABASE:-hapi}"
      PGVECTOR_USER: "${PGVECTOR_USER:-admin}"
      PGVECTOR_PASSWORD: "${PGVECTOR_PASSWORD:-admin}"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./src:/opt/airflow/project/src
      - ./data:/opt/airflow/project/data

    ports:
      - "8081:8080"

    command: api-server


  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: airflow-scheduler

    restart: unless-stopped

    depends_on:
      airflow-postgres:
        condition: service_healthy

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-postgres/${AIRFLOW_DB_NAME:-airflow}"
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:-healthcare-ai-local-jwt-secret}"
      FHIR_BASE_URL: "http://hapi-fhir:8080/fhir"
      PYTHONPATH: "/opt/airflow/project/src"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      PGVECTOR_HOST: "hapi-postgres"
      PGVECTOR_PORT: "5432"
      PGVECTOR_DATABASE: "${PGVECTOR_DATABASE:-hapi}"
      PGVECTOR_USER: "${PGVECTOR_USER:-admin}"
      PGVECTOR_PASSWORD: "${PGVECTOR_PASSWORD:-admin}"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./src:/opt/airflow/project/src
      - ./data:/opt/airflow/project/data

    command: scheduler


  airflow-dag-processor:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: airflow-dag-processor

    restart: unless-stopped

    depends_on:
      airflow-postgres:
        condition: service_healthy

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-postgres/${AIRFLOW_DB_NAME:-airflow}"
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:-healthcare-ai-local-jwt-secret}"
      FHIR_BASE_URL: "http://hapi-fhir:8080/fhir"
      PYTHONPATH: "/opt/airflow/project/src"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      PGVECTOR_HOST: "hapi-postgres"
      PGVECTOR_PORT: "5432"
      PGVECTOR_DATABASE: "${PGVECTOR_DATABASE:-hapi}"
      PGVECTOR_USER: "${PGVECTOR_USER:-admin}"
      PGVECTOR_PASSWORD: "${PGVECTOR_PASSWORD:-admin}"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./src:/opt/airflow/project/src
      - ./data:/opt/airflow/project/data

    command: dag-processor


volumes:
  hapi-postgres-data:
  airflow-postgres-data: